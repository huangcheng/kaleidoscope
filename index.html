<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaleidoscope — SONY CPD-1304 Screensaver</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
#status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font: 16px monospace; }
</style>
</head>
<body>
<div id="status">Loading…</div>
<canvas id="qtcanvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
var Module = {
    canvas: document.getElementById('qtcanvas'),
    setStatus: function(text) {
        document.getElementById('status').innerHTML = text;
    },
    print: function() { console.log.apply(console, arguments); },
    printErr: function() { console.error.apply(console, arguments); },
    onRuntimeInitialized: function() {
        document.getElementById('status').style.display = 'none';
    }
};
</script>
<script async src="kaleidoscope_web.js"></script>
</body>
</html>
