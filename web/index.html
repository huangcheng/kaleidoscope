<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope — SONY CPD-1304 Screensaver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#overlay {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #aaa; font: 12px/1.4 monospace;
    padding: 8px 16px; border-radius: 4px; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
}
#overlay.visible { opacity: 1; }
#loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #666; font: 16px monospace;
}
</style>
</head>
<body>
<div id="loading">Loading…</div>
<canvas id="screen"></canvas>
<div id="overlay">
    Space: next effect &nbsp; c: colour cycling &nbsp; d: drawing &nbsp; a: auto-switch &nbsp; Esc: quit
</div>
<script src="kaleidoscope.js"></script>
<script>
(async function() {
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const loading = document.getElementById('loading');

    // VGA framebuffer dimensions
    const W = 320, H = 200;

    // Create offscreen canvas at native resolution
    const offscreen = document.createElement('canvas');
    offscreen.width = W;
    offscreen.height = H;
    const offCtx = offscreen.getContext('2d');
    const imageData = offCtx.createImageData(W, H);

    // Load WASM module
    const Module = await createKaleidoscope();
    loading.style.display = 'none';

    // Initialize demo
    Module.ccall('kaleidoscope_init', null, [], []);

    // Get pointers to framebuffer and DAC
    const getFB = Module.cwrap('kaleidoscope_get_framebuffer', 'number', []);
    const getDAC = Module.cwrap('kaleidoscope_get_dac', 'number', []);
    const step = Module.cwrap('kaleidoscope_step', 'number', []);
    const key = Module.cwrap('kaleidoscope_key', null, ['number']);
    const phase = Module.cwrap('kaleidoscope_phase', 'number', []);
    const introFrame = Module.cwrap('kaleidoscope_intro_frame', null, []);
    const introEnd = Module.cwrap('kaleidoscope_intro_end', null, []);
    const frameDt = Module.cwrap('kaleidoscope_frame_dt', 'number', []);

    // Resize canvas to fill window
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.imageSmoothingEnabled = false;
    }
    resize();
    window.addEventListener('resize', resize);

    // Show controls briefly on load
    overlay.classList.add('visible');
    setTimeout(() => overlay.classList.remove('visible'), 4000);

    // Keyboard handling
    let overlayTimer = null;
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') return; // don't prevent default for Esc
        e.preventDefault();

        // Map key to ASCII
        let ch = 0;
        if (e.key.length === 1) {
            ch = e.key.charCodeAt(0);
        } else if (e.key === ' ') {
            ch = 32;
        }

        if (ch > 0 && ch < 256) {
            key(ch);
        }

        // Show overlay briefly on any keypress
        overlay.classList.add('visible');
        clearTimeout(overlayTimer);
        overlayTimer = setTimeout(() => overlay.classList.remove('visible'), 2000);
    });

    // Render loop
    let lastTime = performance.now();
    let accumulator = 0;

    function render(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        // Clamp to avoid spiral of death
        const clampedDt = Math.min(dt, 0.25);
        accumulator += clampedDt;

        const targetDt = frameDt();

        while (accumulator >= targetDt) {
            accumulator -= targetDt;

            const p = phase();
            if (p === 0) {
                // Intro phase
                introFrame();
            } else if (p === 1) {
                // Variant phase — just step
                step();
            } else {
                // Main phase
                step();
            }
        }

        // Read framebuffer and DAC from WASM memory
        const fbPtr = getFB();
        const dacPtr = getDAC();

        if (fbPtr && dacPtr) {
            const fb = Module.HEAPU8.subarray(fbPtr, fbPtr + W * H);
            const dac = Module.HEAPU8.subarray(dacPtr, dacPtr + 256 * 3);

            // Convert indexed framebuffer to RGBA
            const pixels = imageData.data;
            for (let i = 0; i < W * H; i++) {
                const idx = fb[i];
                const r = dac[idx * 3];
                const g = dac[idx * 3 + 1];
                const b = dac[idx * 3 + 2];
                // 6-bit DAC → 8-bit: (v << 2) | (v >> 4)
                const pi = i * 4;
                pixels[pi]     = (r << 2) | (r >> 4);
                pixels[pi + 1] = (g << 2) | (g >> 4);
                pixels[pi + 2] = (b << 2) | (b >> 4);
                pixels[pi + 3] = 255;
            }

            offCtx.putImageData(imageData, 0, 0);

            // Scale to fill canvas with nearest-neighbour
            ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);
        }

        requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
})();
</script>
</body>
</html>
